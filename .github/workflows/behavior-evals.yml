name: behavior-evals

# Opt-in: runs real model calls. On a PR it runs only when the PR has the
# 'run-evals' label, was opened by the repo owner, and comes from a branch in
# this repo; it can also be started by hand. Uses pull_request, never
# pull_request_target, so PR code never runs with write tokens.
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    paths:
      - "skills/**"
      - "evals/behavior/**"
      - "evals/run_behavior.py"
  workflow_dispatch:
    inputs:
      skills:
        description: "Skill names separated by spaces (empty = all skills with cases)"
        required: false
        default: ""
      model:
        description: "Model for the agent runs"
        required: false
        default: "haiku"

permissions:
  contents: read

concurrency:
  group: behavior-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'run-evals') &&
       github.event.pull_request.user.login == 'patrob' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pick one credential before anything else runs. CLAUDE_CODE_OAUTH_TOKEN
      # (from `claude setup-token`) wins; ANTHROPIC_API_KEY is the fallback.
      - name: Check auth
        id: auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "mode=api_key" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set; skipping behavior evals."
            echo "Behavior evals skipped: neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set." >> "$GITHUB_STEP_SUMMARY"
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.auth.outputs.mode != 'none'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.auth.outputs.mode != 'none'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.mode != 'none'
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.auth.outputs.mode != 'none'
        run: npm i -g @anthropic-ai/claude-code

      - name: Configure git
        if: steps.auth.outputs.mode != 'none'
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      # Exactly one credential reaches claude. If ANTHROPIC_API_KEY is set it
      # overrides the OAuth token, so in oauth mode it is forced empty. In
      # api_key mode the OAuth variable is unset before the run.
      - name: Run behavior evals (pull request)
        if: steps.auth.outputs.mode != 'none' && github.event_name == 'pull_request'
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.auth.outputs.mode == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ steps.auth.outputs.mode == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$AUTH_MODE" = "api_key" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; else unset ANTHROPIC_API_KEY; fi
          python3 evals/run_behavior.py \
            --changed-from "origin/$BASE_REF" \
            --require-auth \
            --model haiku \
            --max-cases-per-skill 1 \
            --timeout 300 \
            --max-budget-usd 0.50 \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Run behavior evals (manual)
        if: steps.auth.outputs.mode != 'none' && github.event_name == 'workflow_dispatch'
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.auth.outputs.mode == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ steps.auth.outputs.mode == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          SKILLS: ${{ inputs.skills }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ "$AUTH_MODE" = "api_key" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; else unset ANTHROPIC_API_KEY; fi
          set -f
          skill_args=()
          for s in $SKILLS; do skill_args+=(--skill "$s"); done
          python3 evals/run_behavior.py \
            "${skill_args[@]}" \
            --require-auth \
            --model "${MODEL:-haiku}" \
            --max-cases-per-skill 1 \
            --timeout 300 \
            --max-budget-usd 0.50 \
            --summary-file "$GITHUB_STEP_SUMMARY"
