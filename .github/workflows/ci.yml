name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Validate repo
        run: python3 tools/validate.py

      - name: Validator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Skill tests
        run: |
          if ls skills/*/scripts/tests/test_*.py >/dev/null 2>&1; then
            python3 -m unittest discover -s skills -p 'test_*.py' -v
          else
            echo "skipped: no skill tests yet"
          fi

      - name: Golden eval runner tests
        run: python3 -m unittest discover -s evals -p 'test_*.py' -v

  golden-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Golden evals (skills changed in this PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 evals/run_golden.py --changed-from "origin/$BASE_REF"

      - name: Golden evals (all)
        if: github.event_name != 'pull_request'
        run: python3 evals/run_golden.py
